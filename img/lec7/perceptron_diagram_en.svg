<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Georgia, serif">

  <!-- Input → Σ lines -->
  <line x1="86" y1="65"  x2="287" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="86" y1="155" x2="287" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="86" y1="245" x2="287" y2="170" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Bias → Σ line (dashed) -->
  <line x1="320" y1="48" x2="320" y2="120" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Weight labels -->
  <text x="175" y="88"  text-anchor="middle" font-style="italic" font-size="15" fill="#2563eb">w₁</text>
  <text x="175" y="151" text-anchor="middle" font-style="italic" font-size="15" fill="#2563eb">w₂</text>
  <text x="175" y="226" text-anchor="middle" font-style="italic" font-size="15" fill="#2563eb">w₃</text>
  <text x="336" y="88"  font-style="italic" font-size="14" fill="#d97706">b</text>

  <!-- Σ → activation arrow -->
  <line x1="355" y1="155" x2="428" y2="155" stroke="#374151" stroke-width="2"/>
  <polygon points="428,149 440,155 428,161" fill="#374151"/>
  <text x="393" y="145" text-anchor="middle" font-style="italic" font-size="14" fill="#374151">z</text>

  <!-- Activation → output arrow -->
  <line x1="540" y1="155" x2="618" y2="155" stroke="#374151" stroke-width="2"/>
  <polygon points="618,149 630,155 618,161" fill="#374151"/>

  <!-- Input nodes -->
  <circle cx="62" cy="65"  r="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="72"  text-anchor="middle" font-style="italic" font-size="18">x₁</text>

  <circle cx="62" cy="155" r="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="162" text-anchor="middle" font-style="italic" font-size="18">x₂</text>

  <circle cx="62" cy="245" r="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="252" text-anchor="middle" font-style="italic" font-size="18">x₃</text>

  <!-- Bias node -->
  <circle cx="320" cy="26" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="33" text-anchor="middle" font-style="italic" font-size="15">b</text>

  <!-- Summation node -->
  <circle cx="320" cy="155" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="320" y="150" text-anchor="middle" font-size="22">Σ</text>
  <text x="320" y="168" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#166534">w·x + b</text>

  <!-- Activation box -->
  <rect x="440" y="127" width="100" height="56" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="490" y="152" text-anchor="middle" font-style="italic" font-size="16">f(z)</text>
  <text x="490" y="171" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#9d174d">activat.</text>

  <!-- Output node -->
  <circle cx="650" cy="155" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="150" text-anchor="middle" font-style="italic" font-size="18">ŷ</text>
  <text x="650" y="168" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#6d28d9">= f(z)</text>

  <!-- Bottom labels -->
  <text x="62"  y="290" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#6b7280">Inputs</text>
  <text x="320" y="205" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#6b7280">Summation</text>
  <text x="490" y="202" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#6b7280">Activation</text>
  <text x="650" y="200" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#6b7280">Output</text>

</svg>
