<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Georgia, serif">

  <!-- ===== TITLES ===== -->
  <text x="90"  y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Step</text>
  <text x="90"  y="30" text-anchor="middle" font-size="9"  fill="#dc2626">~~δεν χρησιμοποιείται~~</text>

  <text x="270" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Sigmoid</text>
  <text x="270" y="30" text-anchor="middle" font-size="9"  fill="#6b7280">έξοδος binary</text>

  <text x="450" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Tanh</text>
  <text x="450" y="30" text-anchor="middle" font-size="9"  fill="#6b7280">κρυφά επίπεδα (παλαιό)</text>

  <text x="630" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">ReLU</text>
  <text x="630" y="30" text-anchor="middle" font-size="9"  fill="#16a34a">κρυφά επίπεδα (default)</text>

  <text x="810" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Softmax</text>
  <text x="810" y="30" text-anchor="middle" font-size="9"  fill="#6b7280">πολυκλασική έξοδος</text>

  <!-- ===== PANEL BACKGROUNDS ===== -->
  <rect x="10"  y="35" width="160" height="200" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <rect x="190" y="35" width="160" height="200" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <rect x="370" y="35" width="160" height="200" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="550" y="35" width="160" height="200" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <rect x="730" y="35" width="160" height="200" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>

  <!-- Helper macro: each panel cx is center, top=35, h=200, so axes at cy=135, range ±90px = ±3 units -->
  <!-- Scale: x: 1 unit = 30px, y: 1 unit = 60px -->

  <!-- ===== AXES (all panels) ===== -->
  <!-- Step panel cx=90, axes at (90,135) -->
  <line x1="15"  y1="135" x2="165" y2="135" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="90"  y1="40"  x2="90"  y2="230" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="168" y="138" font-size="9" fill="#94a3b8">z</text>
  <text x="92"  y="44"  font-size="9" fill="#94a3b8">f</text>
  <!-- tick marks y -->
  <line x1="87" y1="75"  x2="93" y2="75"  stroke="#94a3b8" stroke-width="0.6"/>
  <text x="78"  y="78"  font-size="8" fill="#94a3b8" text-anchor="end">1</text>
  <line x1="87" y1="135" x2="93" y2="135" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="78"  y="138" font-size="8" fill="#94a3b8" text-anchor="end">0</text>

  <!-- Sigmoid axes cx=270 -->
  <line x1="195" y1="135" x2="345" y2="135" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="270" y1="40"  x2="270" y2="230" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="348" y="138" font-size="9" fill="#94a3b8">z</text>
  <line x1="267" y1="75"  x2="273" y2="75"  stroke="#94a3b8" stroke-width="0.6"/>
  <text x="258"  y="78"  font-size="8" fill="#94a3b8" text-anchor="end">1</text>
  <line x1="267" y1="195" x2="273" y2="195" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="258"  y="198" font-size="8" fill="#94a3b8" text-anchor="end">0</text>
  <!-- dashed 0.5 line -->
  <line x1="195" y1="135" x2="345" y2="135" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Tanh axes cx=450 -->
  <line x1="375" y1="135" x2="525" y2="135" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="450" y1="40"  x2="450" y2="230" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="528" y="138" font-size="9" fill="#94a3b8">z</text>
  <line x1="447" y1="75"  x2="453" y2="75"  stroke="#94a3b8" stroke-width="0.6"/>
  <text x="438"  y="78"  font-size="8" fill="#94a3b8" text-anchor="end">+1</text>
  <line x1="447" y1="195" x2="453" y2="195" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="438"  y="198" font-size="8" fill="#94a3b8" text-anchor="end">−1</text>

  <!-- ReLU axes cx=630 -->
  <line x1="555" y1="175" x2="705" y2="175" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="630" y1="40"  x2="630" y2="230" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="708" y="178" font-size="9" fill="#94a3b8">z</text>
  <line x1="627" y1="75"  x2="633" y2="75"  stroke="#94a3b8" stroke-width="0.6"/>
  <text x="618"  y="78"  font-size="8" fill="#94a3b8" text-anchor="end">3</text>
  <line x1="627" y1="175" x2="633" y2="175" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="618"  y="178" font-size="8" fill="#94a3b8" text-anchor="end">0</text>

  <!-- Softmax: bar chart, no standard axes needed -->

  <!-- ===== STEP FUNCTION ===== -->
  <!-- flat at 0 from z=-3 to z=0, flat at 1 from z=0 to z=3 -->
  <!-- x: z=-3 → x=90-90=0, z=0 → x=90, z=3 → x=90+90=180 (clip to panel) -->
  <!-- y: f=0 → y=135, f=1 → y=135-60=75 -->
  <line x1="20"  y1="135" x2="90"  y2="135" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="90"  y1="75"  x2="160" y2="75"  stroke="#dc2626" stroke-width="2.5"/>
  <line x1="90"  y1="135" x2="90"  y2="75"  stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="90" cy="135" r="3" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="90" cy="75"  r="3" fill="#dc2626"/>
  <!-- annotation -->
  <text x="90" y="255" text-anchor="middle" font-size="9" fill="#dc2626">f'(z) = 0 παντού</text>
  <text x="90" y="267" text-anchor="middle" font-size="9" fill="#dc2626">→ Gradient Descent τυφλό</text>

  <!-- ===== SIGMOID ===== -->
  <!-- σ(z) = 1/(1+e^{-z}), y = 135 - (σ(z)-0.5)*120 so σ=0→y=195, σ=0.5→y=135, σ=1→y=75 -->
  <!-- points at z = -3,-2.5,-2,-1.5,-1,-0.5,0,0.5,1,1.5,2,2.5,3 mapped to x=270+z*30 -->
  <polyline points="
    180,191
    195,188
    210,184
    225,178
    240,168
    255,154
    270,135
    285,116
    300,102
    315,92
    330,86
    345,82
    348,80
  " fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="270" y="255" text-anchor="middle" font-size="9" fill="#d97706">Vanishing gradient</text>
  <text x="270" y="267" text-anchor="middle" font-size="9" fill="#d97706">για |z| μεγάλο</text>

  <!-- ===== TANH ===== -->
  <!-- tanh(z), y = 135 - tanh(z)*60, so tanh=+1→y=75, 0→y=135, -1→y=195 -->
  <polyline points="
    375,194
    390,191
    405,184
    420,171
    435,150
    450,135
    465,120
    480,99
    495,86
    510,79
    522,76
    525,76
  " fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="450" y="255" text-anchor="middle" font-size="9" fill="#3b82f6">Μηδενοκεντρική (-1,+1)</text>
  <text x="450" y="267" text-anchor="middle" font-size="9" fill="#3b82f6">Vanishing gradient στα άκρα</text>

  <!-- ===== ReLU ===== -->
  <!-- f(z)=max(0,z), axes at (630,175), y=175-z*33, z∈[-3,3] x=630+z*30 -->
  <!-- z<0: y stays at 175; z>0: y=175-z*33 -->
  <line x1="560" y1="175" x2="630" y2="175" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="630" y1="175" x2="720" y2="78"  stroke="#16a34a" stroke-width="2.5"/>
  <!-- dead neuron annotation: shade left half -->
  <rect x="560" y="60" width="70" height="115" fill="#fef2f2" fill-opacity="0.5"/>
  <text x="595" y="90" text-anchor="middle" font-size="8" fill="#dc2626">νεκρός</text>
  <text x="595" y="101" text-anchor="middle" font-size="8" fill="#dc2626">νευρώνας</text>
  <text x="595" y="112" text-anchor="middle" font-size="8" fill="#dc2626">(f=0 πάντα)</text>
  <text x="630" y="255" text-anchor="middle" font-size="9" fill="#16a34a">Γρήγορη, χωρίς vanishing</text>
  <text x="630" y="267" text-anchor="middle" font-size="9" fill="#16a34a">gradient για z &gt; 0</text>

  <!-- ===== SOFTMAX bar chart ===== -->
  <!-- 3 classes: dog 0.70, cat 0.20, bird 0.10 -->
  <!-- panel x=730-890, y=35-235, bar area y=60-225 (165px height), max bar=0.70→115px -->
  <text x="757" y="55" text-anchor="middle" font-size="8" fill="#6b7280">z=[2.0, 1.0, 0.5]</text>

  <!-- dog bar -->
  <rect x="745" y="144" width="35" height="81" fill="#7c3aed" rx="3"/>
  <text x="762" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">0.70</text>
  <text x="762" y="238" text-anchor="middle" font-size="9" fill="#374151">🐶</text>

  <!-- cat bar -->
  <rect x="795" y="191" width="35" height="34" fill="#a78bfa" rx="3"/>
  <text x="812" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">0.20</text>
  <text x="812" y="238" text-anchor="middle" font-size="9" fill="#374151">🐱</text>

  <!-- bird bar -->
  <rect x="845" y="208" width="35" height="17" fill="#c4b5fd" rx="3"/>
  <text x="862" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">0.10</text>
  <text x="862" y="238" text-anchor="middle" font-size="9" fill="#374151">🐦</text>

  <!-- sum annotation -->
  <text x="810" y="255" text-anchor="middle" font-size="9" fill="#7c3aed">0.70 + 0.20 + 0.10 = 1.0</text>
  <text x="810" y="267" text-anchor="middle" font-size="9" fill="#7c3aed">→ κατανομή πιθανοτήτων</text>

</svg>
