<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Section backgrounds -->
  <rect x="6"   y="6" width="228" height="298" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="246" y="6" width="228" height="298" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="486" y="6" width="228" height="298" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>

  <!-- ── HEADERS ── -->
  <text x="120" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">① Selection</text>
  <text x="120" y="46" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">(Selection)</text>

  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">② Crossover</text>
  <text x="360" y="46" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">(One-Point Crossover)</text>

  <text x="600" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9a3412">③ Mutation</text>
  <text x="600" y="46" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ea580c">(Bit-Flip Mutation)</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- SECTION 1 — SELECTION                         -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- P1: [1,1,1,1,0]  fitness HIGH → selected -->
  <text x="22" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">P1</text>
  <rect x="46" y="67" width="18" height="18" rx="2" fill="#3b82f6"/><text x="55" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="66" y="67" width="18" height="18" rx="2" fill="#3b82f6"/><text x="75" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="86" y="67" width="18" height="18" rx="2" fill="#3b82f6"/><text x="95" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="106" y="67" width="18" height="18" rx="2" fill="#3b82f6"/><text x="115" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="126" y="67" width="18" height="18" rx="2" fill="#d1d5db"/><text x="135" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>
  <!-- fitness bar high -->
  <rect x="150" y="70" width="60" height="12" rx="2" fill="#bbf7d0"/>
  <rect x="150" y="70" width="56" height="12" rx="2" fill="#22c55e"/>
  <text x="216" y="81" font-family="sans-serif" font-size="15" fill="#16a34a">★</text>

  <!-- P2: [1,0,1,1,0]  fitness MED → selected -->
  <text x="22" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">P2</text>
  <rect x="46" y="105" width="18" height="18" rx="2" fill="#3b82f6"/><text x="55" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="66" y="105" width="18" height="18" rx="2" fill="#d1d5db"/><text x="75" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>
  <rect x="86" y="105" width="18" height="18" rx="2" fill="#3b82f6"/><text x="95" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="106" y="105" width="18" height="18" rx="2" fill="#3b82f6"/><text x="115" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="126" y="105" width="18" height="18" rx="2" fill="#d1d5db"/><text x="135" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>
  <!-- fitness bar medium -->
  <rect x="150" y="108" width="60" height="12" rx="2" fill="#bbf7d0"/>
  <rect x="150" y="108" width="36" height="12" rx="2" fill="#22c55e"/>
  <text x="216" y="119" font-family="sans-serif" font-size="15" fill="#16a34a">★</text>

  <!-- P3: [0,0,1,0,0]  fitness LOW → not selected -->
  <text x="22" y="156" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9ca3af">P3</text>
  <rect x="46" y="143" width="18" height="18" rx="2" fill="#e5e7eb"/><text x="55" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">0</text>
  <rect x="66" y="143" width="18" height="18" rx="2" fill="#e5e7eb"/><text x="75" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">0</text>
  <rect x="86" y="143" width="18" height="18" rx="2" fill="#93c5fd" opacity="0.5"/><text x="95" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">1</text>
  <rect x="106" y="143" width="18" height="18" rx="2" fill="#e5e7eb"/><text x="115" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">0</text>
  <rect x="126" y="143" width="18" height="18" rx="2" fill="#e5e7eb"/><text x="135" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">0</text>
  <!-- fitness bar low -->
  <rect x="150" y="146" width="60" height="12" rx="2" fill="#f3f4f6"/>
  <rect x="150" y="146" width="12" height="12" rx="2" fill="#d1d5db"/>
  <text x="218" y="157" font-family="sans-serif" font-size="13" fill="#d1d5db">✗</text>

  <text x="120" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">Fitness: P1 &gt; P2 &gt; P3</text>
  <text x="120" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e40af">P1 &amp; P2 → next generation</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- SECTION 2 — CROSSOVER                         -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Parent 1: [1,1,1 | 0,0]  blue bits -->
  <text x="258" y="74" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Parent 1:</text>
  <rect x="348" y="62" width="18" height="18" rx="2" fill="#3b82f6"/><text x="357" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="368" y="62" width="18" height="18" rx="2" fill="#3b82f6"/><text x="377" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="388" y="62" width="18" height="18" rx="2" fill="#3b82f6"/><text x="397" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="410" y="62" width="18" height="18" rx="2" fill="#bfdbfe"/><text x="419" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">0</text>
  <rect x="430" y="62" width="18" height="18" rx="2" fill="#bfdbfe"/><text x="439" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">0</text>

  <!-- Parent 2: [0,0,0 | 1,1]  green bits -->
  <text x="258" y="112" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">Parent 2:</text>
  <rect x="348" y="100" width="18" height="18" rx="2" fill="#bbf7d0"/><text x="357" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0</text>
  <rect x="368" y="100" width="18" height="18" rx="2" fill="#bbf7d0"/><text x="377" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0</text>
  <rect x="388" y="100" width="18" height="18" rx="2" fill="#bbf7d0"/><text x="397" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0</text>
  <rect x="410" y="100" width="18" height="18" rx="2" fill="#22c55e"/><text x="419" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="430" y="100" width="18" height="18" rx="2" fill="#22c55e"/><text x="439" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>

  <!-- Cut line at position 3 -->
  <line x1="408" y1="57" x2="408" y2="126" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="408" y="137" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">cut</text>

  <!-- Arrow down -->
  <line x1="360" y1="144" x2="360" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Child 1: P1[0..2] + P2[3..4] -->
  <text x="258" y="192" font-family="sans-serif" font-size="11" font-weight="bold" fill="#555">Child 1:</text>
  <rect x="348" y="180" width="18" height="18" rx="2" fill="#3b82f6"/><text x="357" y="193" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="368" y="180" width="18" height="18" rx="2" fill="#3b82f6"/><text x="377" y="193" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="388" y="180" width="18" height="18" rx="2" fill="#3b82f6"/><text x="397" y="193" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="410" y="180" width="18" height="18" rx="2" fill="#22c55e"/><text x="419" y="193" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="430" y="180" width="18" height="18" rx="2" fill="#22c55e"/><text x="439" y="193" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>

  <!-- Child 2: P2[0..2] + P1[3..4] -->
  <text x="258" y="228" font-family="sans-serif" font-size="11" font-weight="bold" fill="#555">Child 2:</text>
  <rect x="348" y="216" width="18" height="18" rx="2" fill="#bbf7d0"/><text x="357" y="229" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0</text>
  <rect x="368" y="216" width="18" height="18" rx="2" fill="#bbf7d0"/><text x="377" y="229" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0</text>
  <rect x="388" y="216" width="18" height="18" rx="2" fill="#bbf7d0"/><text x="397" y="229" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">0</text>
  <rect x="410" y="216" width="18" height="18" rx="2" fill="#bfdbfe"/><text x="419" y="229" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">0</text>
  <rect x="430" y="216" width="18" height="18" rx="2" fill="#bfdbfe"/><text x="439" y="229" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e40af">0</text>

  <!-- Legend -->
  <rect x="258" y="255" width="12" height="12" rx="1" fill="#3b82f6"/>
  <text x="274" y="265" font-family="sans-serif" font-size="10" fill="#555">from Parent 1</text>
  <rect x="348" y="255" width="12" height="12" rx="1" fill="#22c55e"/>
  <text x="364" y="265" font-family="sans-serif" font-size="10" fill="#555">from Parent 2</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- SECTION 3 — MUTATION                          -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Before: [1,0,1,1,0] -->
  <text x="600" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#555">Before:</text>
  <rect x="510" y="82" width="18" height="18" rx="2" fill="#3b82f6"/><text x="519" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="530" y="82" width="18" height="18" rx="2" fill="#d1d5db"/><text x="539" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>
  <rect x="550" y="82" width="18" height="18" rx="2" fill="#3b82f6"/><text x="559" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <!-- 4th bit highlighted — will flip -->
  <rect x="570" y="80" width="22" height="22" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="572" y="82" width="18" height="18" rx="2" fill="#3b82f6"/><text x="581" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="594" y="82" width="18" height="18" rx="2" fill="#d1d5db"/><text x="603" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>

  <!-- Arrow with Bit Flip label -->
  <line x1="580" y1="108" x2="580" y2="148" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="614" y="134" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">Bit Flip!</text>
  <text x="614" y="147" font-family="sans-serif" font-size="10" fill="#dc2626">1 → 0</text>

  <!-- After: [1,0,1,0,0] — 4th bit flipped to 0, red -->
  <text x="600" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#555">After:</text>
  <rect x="510" y="176" width="18" height="18" rx="2" fill="#3b82f6"/><text x="519" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <rect x="530" y="176" width="18" height="18" rx="2" fill="#d1d5db"/><text x="539" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>
  <rect x="550" y="176" width="18" height="18" rx="2" fill="#3b82f6"/><text x="559" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">1</text>
  <!-- Flipped bit: red -->
  <rect x="570" y="174" width="22" height="22" rx="3" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="572" y="176" width="18" height="18" rx="2" fill="#dc2626"/><text x="581" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">0</text>
  <rect x="594" y="176" width="18" height="18" rx="2" fill="#d1d5db"/><text x="603" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">0</text>

  <text x="600" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9a3412">4th bit: 1 → 0</text>
  <text x="600" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Maintains diversity</text>
  <text x="600" y="256" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Avoids local optima</text>
</svg>
