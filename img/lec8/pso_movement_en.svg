<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450">
  <defs>
    <marker id="arr-blue"   markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f97316"/></marker>
    <marker id="arr-red"    markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ef4444"/></marker>
    <marker id="arr-green"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#16a34a"/></marker>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="744" height="434" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="70" y1="360" x2="700" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="70" y1="360" x2="70"  y2="55"  stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="705" y="365" font-family="sans-serif" font-size="12" fill="#64748b">x₁</text>
  <text x="65"  y="52"  text-anchor="end" font-family="sans-serif" font-size="12" fill="#64748b">x₂</text>

  <!-- Contour ellipses — global optimum at (560, 140) -->
  <ellipse cx="560" cy="140" rx="155" ry="100" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="560" cy="140" rx="100" ry="65"  fill="none" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="5,3"/>
  <ellipse cx="560" cy="140" rx="50"  ry="33"  fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <ellipse cx="560" cy="140" rx="18"  ry="12"  fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>

  <!-- Global optimum star + label -->
  <text x="560" y="147" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7c3aed">★</text>
  <rect x="582" y="118" width="70" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="584" y="132" font-family="sans-serif" font-size="12" fill="#6d28d9">Optimum</text>

  <!-- Background particles (other swarm members) -->
  <circle cx="470" cy="300" r="9" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="620" cy="255" r="9" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="110" cy="315" r="9" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>

  <!-- ===== ARROWS (drawn before circles so circles appear on top) ===== -->

  <!-- Blue dashed: inertia w·vᵢᵗ — short arrow showing previous velocity direction -->
  <line x1="164" y1="272" x2="208" y2="249" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)" stroke-dasharray="5,3"/>

  <!-- Orange: cognitive pull toward pbest (410,145) -->
  <line x1="164" y1="273" x2="399" y2="151" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Red: social pull toward gbest (520,215) -->
  <line x1="166" y1="277" x2="507" y2="217" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Green: resultant new velocity vᵢᵗ⁺¹ toward new position (255,245) -->
  <line x1="165" y1="274" x2="240" y2="250" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- ===== Arrow labels (all with white backgrounds) ===== -->

  <!-- w·vᵢᵗ: above the blue arrow -->
  <rect x="172" y="236" width="48" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="174" y="250" font-family="sans-serif" font-size="13" fill="#1d4ed8">w·vᵢᵗ</text>

  <!-- c₁r₁(pbest−xᵢᵗ): above orange arrow, well clear of i' -->
  <rect x="228" y="183" width="148" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="230" y="197" font-family="sans-serif" font-size="13" fill="#c2410c">c₁r₁(pbest − xᵢᵗ)</text>

  <!-- vᵢᵗ⁺¹: below green arrow -->
  <rect x="185" y="260" width="48" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="187" y="274" font-family="sans-serif" font-size="13" fill="#15803d">vᵢᵗ⁺¹</text>

  <!-- c₂r₂(gbest−xᵢᵗ): below red arrow midpoint -->
  <rect x="292" y="264" width="148" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="294" y="278" font-family="sans-serif" font-size="13" fill="#b91c1c">c₂r₂(gbest − xᵢᵗ)</text>

  <!-- ===== PARTICLE CIRCLES (drawn on top of arrows) ===== -->

  <!-- Current position xᵢᵗ — lower left -->
  <circle cx="150" cy="280" r="17" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="150" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">i</text>
  <rect x="133" y="299" width="34" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="150" y="313" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">xᵢᵗ</text>

  <!-- Personal best pbest — upper middle -->
  <circle cx="410" cy="145" r="14" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="410" y="151" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">pb</text>
  <rect x="427" y="126" width="54" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="429" y="140" font-family="sans-serif" font-size="13" fill="#c2410c">pbest</text>

  <!-- Global best gbest — right middle -->
  <circle cx="520" cy="215" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="520" y="221" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">gb</text>
  <rect x="537" y="196" width="54" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="539" y="210" font-family="sans-serif" font-size="13" fill="#b91c1c">gbest</text>

  <!-- New position xᵢᵗ⁺¹ — dashed border, middle area -->
  <circle cx="255" cy="245" r="14" fill="#16a34a" stroke="#15803d" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="255" y="251" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">i'</text>
  <rect x="238" y="210" width="54" height="18" rx="3" fill="white" opacity="0.95"/>
  <text x="265" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#15803d">xᵢᵗ⁺¹</text>

  <!-- ===== Legend strip at bottom ===== -->
  <rect x="30" y="375" width="700" height="64" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>

  <line x1="50"  y1="394" x2="76"  y2="394" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="81"  y="398" font-family="sans-serif" font-size="11" fill="#1d4ed8">Inertia (w·v)</text>

  <line x1="202" y1="394" x2="228" y2="394" stroke="#f97316" stroke-width="2.5"/>
  <text x="233" y="398" font-family="sans-serif" font-size="11" fill="#c2410c">Individual experience</text>

  <line x1="384" y1="394" x2="410" y2="394" stroke="#ef4444" stroke-width="2.5"/>
  <text x="415" y="398" font-family="sans-serif" font-size="11" fill="#b91c1c">Social experience</text>

  <line x1="563" y1="394" x2="589" y2="394" stroke="#16a34a" stroke-width="3"/>
  <text x="594" y="398" font-family="sans-serif" font-size="11" fill="#15803d">New velocity</text>

  <!-- Formulas inside legend box -->
  <text x="380" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">vᵢᵗ⁺¹ = w·vᵢᵗ + c₁r₁(pbest − xᵢᵗ) + c₂r₂(gbest − xᵢᵗ)   |   xᵢᵗ⁺¹ = xᵢᵗ + vᵢᵗ⁺¹</text>
</svg>
