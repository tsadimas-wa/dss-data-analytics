<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arr-thick" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background panels -->
  <rect x="10" y="10" width="335" height="340" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <rect x="375" y="10" width="335" height="340" rx="10" fill="#fef9c3" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Panel titles -->
  <text x="177" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#075985">Αρχική Κατάσταση</text>
  <text x="177" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">(όλες οι διαδρομές εξίσου πιθανές)</text>
  <text x="542" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">Μετά από Πολλές Γενιές</text>
  <text x="542" y="51" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">(φερομόνη συσσωρεύτηκε στη βέλτιστη διαδρομή)</text>

  <!-- ===== LEFT PANEL: initial uniform graph ===== -->
  <!-- Nodes: A(80,180) B(175,80) C(270,180) D(175,280) E(175,180) -->
  <!-- A -->
  <circle cx="80" cy="190" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">A</text>
  <!-- B -->
  <circle cx="175" cy="100" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">B</text>
  <!-- C -->
  <circle cx="285" cy="150" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="285" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">C</text>
  <!-- D -->
  <circle cx="285" cy="280" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="285" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">D</text>
  <!-- E -->
  <circle cx="175" cy="280" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">E</text>

  <!-- Thin equal edges -->
  <line x1="98" y1="179" x2="157" y2="111" stroke="#93c5fd" stroke-width="2"/>
  <line x1="193" y1="105" x2="267" y2="143" stroke="#93c5fd" stroke-width="2"/>
  <line x1="285" y1="170" x2="285" y2="260" stroke="#93c5fd" stroke-width="2"/>
  <line x1="268" y1="271" x2="193" y2="271" stroke="#93c5fd" stroke-width="2"/>
  <line x1="157" y1="271" x2="98" y2="203" stroke="#93c5fd" stroke-width="2"/>
  <line x1="98" y1="198" x2="267" y2="155" stroke="#93c5fd" stroke-width="2"/>
  <line x1="193" y1="114" x2="175" y2="261" stroke="#93c5fd" stroke-width="2"/>
  <line x1="175" y1="119" x2="175" y2="261" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- pheromone label -->
  <text x="177" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Φερομόνη ≈ ίδια παντού</text>

  <!-- ===== RIGHT PANEL: converged optimal path ===== -->
  <!-- Nodes: A(445,190) B(540,100) C(650,150) D(650,280) E(540,280) -->
  <!-- A -->
  <circle cx="445" cy="190" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="445" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">A</text>
  <!-- B -->
  <circle cx="540" cy="100" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="540" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">B</text>
  <!-- C -->
  <circle cx="650" cy="150" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">C</text>
  <!-- D -->
  <circle cx="650" cy="280" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">D</text>
  <!-- E -->
  <circle cx="540" cy="280" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="540" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">E</text>

  <!-- Thin faded non-optimal edges -->
  <line x1="463" y1="179" x2="522" y2="111" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="540" y1="119" x2="540" y2="261" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="463" y1="198" x2="632" y2="155" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Thick optimal path: A→B→C→D→E→A -->
  <line x1="463" y1="181" x2="523" y2="112" stroke="#d97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="558" y1="106" x2="632" y2="144" stroke="#d97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="650" y1="170" x2="650" y2="261" stroke="#d97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="632" y1="278" x2="558" y2="278" stroke="#d97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="522" y1="271" x2="461" y2="205" stroke="#d97706" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-thick)"/>

  <!-- pheromone label -->
  <text x="542" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#92400e" font-weight="bold">Βέλτιστη διαδρομή — υψηλή φερομόνη</text>
  <text x="542" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">Υπόλοιπες: εξατμίστηκαν</text>

  <!-- Legend -->
  <line x1="395" y1="195" x2="425" y2="195" stroke="#d97706" stroke-width="6"/>
  <text x="430" y="199" font-family="sans-serif" font-size="10" fill="#92400e">Έντονη φερομόνη</text>
  <line x1="395" y1="212" x2="425" y2="212" stroke="#fde68a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="430" y="216" font-family="sans-serif" font-size="10" fill="#64748b">Αδύναμη φερομόνη</text>
</svg>
