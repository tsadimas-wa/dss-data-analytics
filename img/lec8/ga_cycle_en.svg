<svg xmlns="http://www.w3.org/2000/svg" width="760" height="265" viewBox="0 0 760 265">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ══════ TOP ROW (cy=78) ══════ -->

  <!-- ① Initialization -->
  <rect x="10" y="56" width="130" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="75" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">① Initialization</text>
  <text x="75" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3b82f6">(Initialize)</text>

  <!-- Arrow ①→② -->
  <line x1="140" y1="78" x2="172" y2="78" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ② Fitness Evaluation -->
  <rect x="172" y="56" width="152" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="248" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#713f12">② Evaluation</text>
  <text x="248" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a16207">Fitness</text>

  <!-- Arrow ②→◇ -->
  <line x1="324" y1="78" x2="342" y2="78" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ◇ Termination Criterion center=(425,78) half-w=82 half-h=32 -->
  <polygon points="425,46 507,78 425,110 343,78" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="425" y="74" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9d174d">Termination</text>
  <text x="425" y="87" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9d174d">Criterion?</text>

  <!-- YES → End -->
  <line x1="507" y1="78" x2="556" y2="78" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="530" y="71" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a" font-weight="bold">YES</text>
  <ellipse cx="608" cy="78" rx="52" ry="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="608" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#166534">End</text>

  <!-- ══════ NO: ◇ bottom → down → left → down to ③ ══════ -->
  <polyline points="425,110 425,158 157,158 157,190" fill="none"
            stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="438" y="138" font-family="sans-serif" font-size="11" fill="#dc2626" font-weight="bold">NO</text>

  <!-- ══════ BOTTOM ROW (cy=212), left→right ══════ -->

  <!-- ③ Selection -->
  <rect x="97" y="190" width="120" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="157" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4c1d95">③ Selection</text>
  <text x="157" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">(Selection)</text>

  <!-- Arrow ③→④ -->
  <line x1="217" y1="212" x2="247" y2="212" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ④ Crossover -->
  <rect x="247" y="190" width="126" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="310" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4c1d95">④ Crossover</text>
  <text x="310" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">(Crossover)</text>

  <!-- Arrow ④→⑤ -->
  <line x1="373" y1="212" x2="403" y2="212" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ⑤ Mutation -->
  <rect x="403" y="190" width="120" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="463" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4c1d95">⑤ Mutation</text>
  <text x="463" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6d28d9">(Mutation)</text>

  <!-- Arrow ⑤→⑥ -->
  <line x1="523" y1="212" x2="553" y2="212" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ⑥ Replacement -->
  <rect x="553" y="190" width="136" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="621" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">⑥ Replacement</text>
  <text x="621" y="224" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">(New Generation)</text>

  <!-- ══════ LOOP BACK: ⑥ right → far right → up → left → top of ② ══════ -->
  <polyline points="689,212 738,212 738,30 248,30 248,56" fill="none"
            stroke="#555" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="493" y="22" text-anchor="middle" font-family="sans-serif"
        font-size="11" fill="#555" font-style="italic">New Generation</text>
</svg>
