<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-b"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="arr-g"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="arr-o"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f97316"/></marker>
    <marker id="arr-r"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ef4444"/></marker>
    <marker id="arr-p"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#a855f7"/></marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="310" fill="#f8f9fa" rx="8"/>

  <!-- ====== TOP: Chromosome (Genotype) ====== -->
  <text x="10" y="18" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#374151">Genotype — Chromosome:</text>

  <!-- City colors: A=blue, B=orange, C=green, D=purple, E=red -->
  <!-- Chromosome: [A, C, B, E, D] -->

  <!-- Cell A -->
  <rect x="10"  y="24" width="52" height="36" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="36"  y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">A</text>
  <!-- Arrow → -->
  <line x1="64" y1="42" x2="76" y2="42" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Cell C -->
  <rect x="78"  y="24" width="52" height="36" rx="6" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="104" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">C</text>
  <!-- Arrow → -->
  <line x1="132" y1="42" x2="144" y2="42" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Cell B -->
  <rect x="146" y="24" width="52" height="36" rx="6" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="172" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">B</text>
  <!-- Arrow → -->
  <line x1="200" y1="42" x2="212" y2="42" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Cell E -->
  <rect x="214" y="24" width="52" height="36" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="240" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">E</text>
  <!-- Arrow → -->
  <line x1="268" y1="42" x2="280" y2="42" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Cell D -->
  <rect x="282" y="24" width="52" height="36" rx="6" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/>
  <text x="308" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">D</text>
  <!-- Return arrow -->
  <line x1="334" y1="42" x2="346" y2="42" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Return label + back to A indication -->
  <rect x="348" y="30" width="54" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="375" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1e40af">A</text>
  <text x="414" y="46" font-family="Arial,sans-serif" font-size="11" fill="#555" font-style="italic">(return)</text>

  <!-- Separator -->
  <line x1="10" y1="74" x2="490" y2="74" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ====== BOTTOM: Tour Map (Phenotype) ====== -->
  <text x="10" y="90" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#374151">Phenotype — Corresponding Route:</text>

  <!-- City positions: A(150,170) B(320,148) C(398,228) D(300,295) E(90,258) -->

  <!-- Tour edges (drawn first, under nodes) -->
  <!-- ① A→C: blue -->
  <line x1="162" y1="174" x2="386" y2="227" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <!-- ② C→B: green -->
  <line x1="392" y1="218" x2="329" y2="156" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <!-- ③ B→E: orange -->
  <line x1="310" y1="152" x2="101" y2="256" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-o)"/>
  <!-- ④ E→D: red -->
  <line x1="101" y1="266" x2="289" y2="292" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <!-- ⑤ D→A: purple -->
  <line x1="291" y1="287" x2="155" y2="178" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arr-p)"/>

  <!-- Edge labels (sequence numbers) -->
  <!-- ① midpoint A→C: (274, 200) -->
  <circle cx="274" cy="200" r="10" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="274" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#3b82f6">①</text>
  <!-- ② midpoint C→B: (360, 185) -->
  <circle cx="360" cy="185" r="10" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#22c55e">②</text>
  <!-- ③ midpoint B→E: (205, 205) -->
  <circle cx="205" cy="205" r="10" fill="white" stroke="#f97316" stroke-width="1.5"/>
  <text x="205" y="209" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f97316">③</text>
  <!-- ④ midpoint E→D: (195, 277) -->
  <circle cx="195" cy="277" r="10" fill="white" stroke="#ef4444" stroke-width="1.5"/>
  <text x="195" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ef4444">④</text>
  <!-- ⑤ midpoint D→A: (222, 232) -->
  <circle cx="222" cy="232" r="10" fill="white" stroke="#a855f7" stroke-width="1.5"/>
  <text x="222" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#a855f7">⑤</text>

  <!-- City nodes (drawn on top of edges) -->
  <!-- A -->
  <circle cx="150" cy="170" r="16" fill="#3b82f6" stroke="white" stroke-width="2.5"/>
  <text x="150" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">A</text>
  <!-- B -->
  <circle cx="320" cy="148" r="16" fill="#f97316" stroke="white" stroke-width="2.5"/>
  <text x="320" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">B</text>
  <!-- C -->
  <circle cx="398" cy="228" r="16" fill="#22c55e" stroke="white" stroke-width="2.5"/>
  <text x="398" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">C</text>
  <!-- D -->
  <circle cx="300" cy="295" r="16" fill="#a855f7" stroke="white" stroke-width="2.5"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">D</text>
  <!-- E -->
  <circle cx="90"  cy="260" r="16" fill="#ef4444" stroke="white" stroke-width="2.5"/>
  <text x="90"  y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">E</text>
</svg>
