<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
  <defs>
    <marker id="arr-blue"   markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f97316"/></marker>
    <marker id="arr-red"    markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#ef4444"/></marker>
    <marker id="arr-green"  markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#16a34a"/></marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="700" height="410" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">PSO — Κίνηση Σωματιδίου</text>

  <!-- Axes -->
  <line x1="60" y1="320" x2="660" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="60" y1="320" x2="60"  y2="60"  stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="665" y="325" font-family="sans-serif" font-size="11" fill="#64748b">x₁</text>
  <text x="55"  y="55"  text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">x₂</text>

  <!-- Contour ellipses -->
  <ellipse cx="490" cy="155" rx="170" ry="110" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="490" cy="155" rx="110" ry="70"  fill="none" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="5,3"/>
  <ellipse cx="490" cy="155" rx="55"  ry="35"  fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <ellipse cx="490" cy="155" rx="20"  ry="13"  fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>

  <!-- Global optimum star + label -->
  <text x="490" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7c3aed">★</text>
  <rect x="512" y="131" width="63" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="514" y="144" font-family="sans-serif" font-size="11" fill="#6d28d9">Βέλτιστο</text>

  <!-- Background particles -->
  <circle cx="200" cy="260" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="580" cy="270" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>

  <!-- ===== Arrows (drawn before circles so circles appear on top) ===== -->

  <!-- Blue dashed: inertia w·vᵢᵗ -->
  <line x1="198" y1="175" x2="236" y2="192" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)" stroke-dasharray="5,3"/>
  <!-- Orange: pull toward pbest -->
  <line x1="250" y1="185" x2="338" y2="154" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <!-- Red: pull toward gbest -->
  <line x1="252" y1="194" x2="448" y2="180" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <!-- Green: new velocity vᵢᵗ⁺¹ -->
  <line x1="253" y1="184" x2="327" y2="159" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- Arrow labels — all with white background -->

  <!-- w·vᵢᵗ: upper-left of blue arrow -->
  <rect x="162" y="149" width="42" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="164" y="162" font-family="sans-serif" font-size="11" fill="#1d4ed8">w·vᵢᵗ</text>

  <!-- c₁r₁(pbest−xᵢ): above orange arrow midpoint -->
  <rect x="243" y="133" width="122" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="245" y="146" font-family="sans-serif" font-size="11" fill="#c2410c">c₁r₁(pbest − xᵢᵗ)</text>

  <!-- vᵢᵗ⁺¹: left of green arrow (below blue label, avoid overlap) -->
  <rect x="218" y="168" width="40" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="220" y="181" font-family="sans-serif" font-size="11" fill="#15803d">vᵢᵗ⁺¹</text>

  <!-- c₂r₂(gbest−xᵢ): below red arrow -->
  <rect x="315" y="197" width="126" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="317" y="210" font-family="sans-serif" font-size="11" fill="#b91c1c">c₂r₂(gbest − xᵢᵗ)</text>

  <!-- ===== Particle circles (on top of arrows) ===== -->

  <!-- Current position xᵢᵗ -->
  <circle cx="240" cy="190" r="14" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="240" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">i</text>
  <rect x="227" y="204" width="26" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="240" y="217" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1d4ed8">xᵢᵗ</text>

  <!-- Personal best pbest -->
  <circle cx="350" cy="150" r="11" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="350" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">pb</text>
  <rect x="364" y="133" width="42" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="366" y="146" font-family="sans-serif" font-size="11" fill="#c2410c">pbest</text>

  <!-- Global best gbest -->
  <circle cx="460" cy="175" r="11" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">gb</text>
  <rect x="474" y="158" width="42" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="476" y="171" font-family="sans-serif" font-size="11" fill="#b91c1c">gbest</text>

  <!-- New position xᵢᵗ⁺¹ (dashed border = predicted) -->
  <circle cx="340" cy="155" r="13" fill="#16a34a" stroke="#15803d" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">i'</text>
  <rect x="322" y="125" width="36" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="340" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#15803d">xᵢᵗ⁺¹</text>

  <!-- ===== Legend box (separated from formula area) ===== -->
  <rect x="530" y="295" width="172" height="72" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="538" y1="310" x2="558" y2="310" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="562" y="314" font-family="sans-serif" font-size="11" fill="#1d4ed8">Αδράνεια (w·v)</text>
  <line x1="538" y1="326" x2="558" y2="326" stroke="#f97316" stroke-width="2.5"/>
  <text x="562" y="330" font-family="sans-serif" font-size="11" fill="#c2410c">Ατομική εμπειρία</text>
  <line x1="538" y1="342" x2="558" y2="342" stroke="#ef4444" stroke-width="2.5"/>
  <text x="562" y="346" font-family="sans-serif" font-size="11" fill="#b91c1c">Κοινωνική εμπειρία</text>
  <line x1="538" y1="358" x2="558" y2="358" stroke="#16a34a" stroke-width="3"/>
  <text x="562" y="362" font-family="sans-serif" font-size="11" fill="#15803d">Νέα ταχύτητα</text>

  <!-- ===== Formula — well below legend ===== -->
  <text x="310" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">vᵢᵗ⁺¹ = w·vᵢᵗ + c₁r₁(pbest − xᵢᵗ) + c₂r₂(gbest − xᵢᵗ)</text>
  <text x="310" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">xᵢᵗ⁺¹ = xᵢᵗ + vᵢᵗ⁺¹</text>
</svg>
