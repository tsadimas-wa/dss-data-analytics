<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="700" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">PSO — Κίνηση Σωματιδίου</text>

  <!-- Axis -->
  <line x1="60" y1="320" x2="660" y2="320" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="60" y1="320" x2="60" y2="60" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="665" y="325" font-family="sans-serif" font-size="11" fill="#64748b">x₁</text>
  <text x="55" y="55" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">x₂</text>

  <!-- Contour ellipses representing objective function landscape -->
  <ellipse cx="490" cy="155" rx="170" ry="110" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="490" cy="155" rx="110" ry="70" fill="none" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="5,3"/>
  <ellipse cx="490" cy="155" rx="55" ry="35" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
  <ellipse cx="490" cy="155" rx="20" ry="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>

  <!-- Global optimum star -->
  <text x="490" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7c3aed">★</text>
  <text x="510" y="148" font-family="sans-serif" font-size="10" fill="#6d28d9">Βέλτιστο</text>

  <!-- Other particles (background) -->
  <circle cx="200" cy="260" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="580" cy="270" r="10" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>

  <!-- ===== Main highlighted particle ===== -->
  <!-- Current position -->
  <circle cx="240" cy="190" r="14" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="240" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">i</text>
  <text x="225" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1d4ed8">xᵢᵗ</text>

  <!-- Personal best position -->
  <circle cx="350" cy="150" r="11" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="350" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">pb</text>
  <text x="374" y="145" font-family="sans-serif" font-size="10" fill="#c2410c">pbest</text>

  <!-- Global best position -->
  <circle cx="460" cy="175" r="11" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">gb</text>
  <text x="472" y="168" font-family="sans-serif" font-size="10" fill="#b91c1c">gbest</text>

  <!-- New position (result) -->
  <circle cx="340" cy="155" r="13" fill="#16a34a" stroke="#15803d" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="white">i'</text>
  <text x="315" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">xᵢᵗ⁺¹</text>

  <!-- Arrow: current velocity (blue) — past direction -->
  <line x1="198" y1="175" x2="236" y2="192" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)" stroke-dasharray="5,3"/>
  <text x="200" y="160" font-family="sans-serif" font-size="10" fill="#1d4ed8">w·vᵢᵗ</text>

  <!-- Arrow: pull toward pbest (orange) -->
  <line x1="250" y1="185" x2="338" y2="154" stroke="#f97316" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="275" y="162" font-family="sans-serif" font-size="10" fill="#c2410c">c₁r₁(pbest−xᵢ)</text>

  <!-- Arrow: pull toward gbest (red) -->
  <line x1="252" y1="194" x2="448" y2="180" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="350" y="208" font-family="sans-serif" font-size="10" fill="#b91c1c">c₂r₂(gbest−xᵢ)</text>

  <!-- Arrow: new velocity / movement (green) -->
  <line x1="253" y1="184" x2="327" y2="159" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="265" y="183" font-family="sans-serif" font-size="10" fill="#15803d">vᵢᵗ⁺¹</text>

  <!-- Legend box -->
  <rect x="530" y="290" width="170" height="68" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="538" y1="305" x2="558" y2="305" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="562" y="309" font-family="sans-serif" font-size="10" fill="#1d4ed8">Αδράνεια (w·v)</text>
  <line x1="538" y1="320" x2="558" y2="320" stroke="#f97316" stroke-width="2.5"/>
  <text x="562" y="324" font-family="sans-serif" font-size="10" fill="#c2410c">Ατομική εμπειρία</text>
  <line x1="538" y1="335" x2="558" y2="335" stroke="#ef4444" stroke-width="2.5"/>
  <text x="562" y="339" font-family="sans-serif" font-size="10" fill="#b91c1c">Κοινωνική εμπειρία</text>
  <line x1="538" y1="350" x2="558" y2="350" stroke="#16a34a" stroke-width="3"/>
  <text x="562" y="354" font-family="sans-serif" font-size="10" fill="#15803d">Νέα ταχύτητα</text>

  <!-- Formula label -->
  <text x="360" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">vᵢᵗ⁺¹ = w·vᵢᵗ + c₁r₁(pbest−xᵢᵗ) + c₂r₂(gbest−xᵢᵗ)</text>
  <text x="360" y="363" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">xᵢᵗ⁺¹ = xᵢᵗ + vᵢᵗ⁺¹</text>
</svg>
