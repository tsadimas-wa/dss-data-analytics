<svg xmlns="http://www.w3.org/2000/svg" width="520" height="570" viewBox="0 0 520 570">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- ① Αρχικοποίηση -->
  <rect x="160" y="20" width="180" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e40af">① Αρχικοποίηση</text>
  <text x="250" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">(Initialize Population)</text>

  <!-- Arrow 1→2 -->
  <line x1="250" y1="64" x2="250" y2="96" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ② Αξιολόγηση Fitness -->
  <rect x="160" y="98" width="180" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="250" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#713f12">② Αξιολόγηση Fitness</text>
  <text x="250" y="132" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a16207">(Evaluate Fitness)</text>

  <!-- Arrow 2→diamond -->
  <line x1="250" y1="142" x2="250" y2="170" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Diamond: Κριτήριο Τερματισμού; center=(250,198) half-w=80 half-h=28 -->
  <polygon points="250,170 330,198 250,226 170,198" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9d174d">Κριτήριο</text>
  <text x="250" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9d174d">Τερματισμού;</text>

  <!-- ΝΑΙ branch → right → Τέλος -->
  <line x1="330" y1="198" x2="398" y2="198" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="362" y="191" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a" font-weight="bold">ΝΑΙ</text>
  <ellipse cx="447" cy="198" rx="44" ry="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="447" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">Τέλος</text>

  <!-- ΟΧΙ Arrow → ③ Επιλογή -->
  <line x1="250" y1="226" x2="250" y2="258" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="262" y="246" font-family="sans-serif" font-size="11" fill="#dc2626" font-weight="bold">ΟΧΙ</text>

  <!-- ③ Επιλογή -->
  <rect x="160" y="260" width="180" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4c1d95">③ Επιλογή</text>
  <text x="250" y="294" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">(Selection)</text>

  <!-- Arrow 3→4 -->
  <line x1="250" y1="304" x2="250" y2="338" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ④ Διασταύρωση -->
  <rect x="160" y="340" width="180" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4c1d95">④ Διασταύρωση</text>
  <text x="250" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">(Crossover)</text>

  <!-- Arrow 4→5 -->
  <line x1="250" y1="384" x2="250" y2="418" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ⑤ Μετάλλαξη -->
  <rect x="160" y="420" width="180" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4c1d95">⑤ Μετάλλαξη</text>
  <text x="250" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">(Mutation)</text>

  <!-- Arrow 5→6 -->
  <line x1="250" y1="464" x2="250" y2="498" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ⑥ Αντικατάσταση -->
  <rect x="160" y="500" width="180" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="518" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">⑥ Αντικατάσταση</text>
  <text x="250" y="534" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">(Replacement / New Gen.)</text>

  <!-- Loop back: left of ⑥ → up → left of ② -->
  <path d="M 160 522 Q 65 522 65 310 Q 65 98 160 98"
        stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3"/>
  <text x="42" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555" font-style="italic">Νέα</text>
  <text x="42" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555" font-style="italic">Γενιά</text>
</svg>
