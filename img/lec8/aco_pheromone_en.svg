<svg xmlns="http://www.w3.org/2000/svg" width="720" height="415" viewBox="0 0 720 415">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arr-thick" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background panels -->
  <rect x="10"  y="10" width="335" height="375" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <rect x="375" y="10" width="335" height="375" rx="10" fill="#fef9c3" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Panel titles -->
  <text x="177" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#075985">Initial State</text>
  <text x="177" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">(all routes equally likely)</text>
  <text x="542" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">After Many Generations</text>
  <text x="542" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">(pheromone accumulated on optimal route)</text>

  <!-- ===== LEFT PANEL: uniform pheromone ===== -->
  <!-- Nodes: A(80,190) B(175,100) C(285,150) D(285,280) E(175,280) -->

  <!-- Thin equal edges (all same weight) -->
  <g stroke="#93c5fd" stroke-width="2" fill="none">
    <line x1="98"  y1="180" x2="157" y2="112"/>  <!-- A-B -->
    <line x1="193" y1="105" x2="267" y2="143"/>  <!-- B-C -->
    <line x1="285" y1="170" x2="285" y2="262"/>  <!-- C-D -->
    <line x1="268" y1="272" x2="193" y2="272"/>  <!-- D-E -->
    <line x1="157" y1="272" x2="98"  y2="203"/>  <!-- E-A -->
    <line x1="98"  y1="198" x2="267" y2="156"/>  <!-- A-C (skip) -->
    <line x1="193" y1="114" x2="176" y2="263"/>  <!-- B-E (skip) -->
  </g>

  <!-- City nodes LEFT -->
  <circle cx="80"  cy="190" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80"  y="196" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="175" cy="100" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">B</text>
  <circle cx="285" cy="150" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="285" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">C</text>
  <circle cx="285" cy="280" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="285" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">D</text>
  <circle cx="175" cy="280" r="20" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">E</text>

  <!-- Left bottom label — white background for readability -->
  <rect x="52" y="330" width="250" height="24" rx="5" fill="white" opacity="0.9"/>
  <text x="177" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">Pheromone ≈ equal on all edges</text>

  <!-- ===== RIGHT PANEL: converged optimal path ===== -->
  <!-- Nodes: A(445,190) B(540,100) C(650,150) D(650,280) E(540,280) -->

  <!-- Non-optimal edges — gray dashed (skip edges only, NOT A-B which is optimal) -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" fill="none">
    <line x1="540" y1="119" x2="540" y2="262"/>  <!-- B-E skip -->
    <line x1="463" y1="199" x2="632" y2="156"/>  <!-- A-C skip -->
    <line x1="558" y1="277" x2="464" y2="203"/>  <!-- C diagonal skip (D-A direction) -->
  </g>

  <!-- Thick optimal path A→B→C→D→E→A -->
  <line x1="463" y1="181" x2="523" y2="112" stroke="#d97706" stroke-width="7" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="558" y1="106" x2="632" y2="144" stroke="#d97706" stroke-width="7" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="650" y1="170" x2="650" y2="261" stroke="#d97706" stroke-width="7" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="632" y1="278" x2="558" y2="278" stroke="#d97706" stroke-width="7" stroke-linecap="round" marker-end="url(#arr-thick)"/>
  <line x1="522" y1="271" x2="461" y2="205" stroke="#d97706" stroke-width="7" stroke-linecap="round" marker-end="url(#arr-thick)"/>

  <!-- City nodes RIGHT -->
  <circle cx="445" cy="190" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="445" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">A</text>
  <circle cx="540" cy="100" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="540" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">B</text>
  <circle cx="650" cy="150" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">C</text>
  <circle cx="650" cy="280" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="650" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">D</text>
  <circle cx="540" cy="280" r="20" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <text x="540" y="286" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">E</text>

  <!-- Right bottom labels — white background -->
  <rect x="385" y="320" width="315" height="50" rx="5" fill="white" opacity="0.9"/>
  <text x="542" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#92400e">Optimal route: high pheromone</text>
  <text x="542" y="357" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">Remaining edges: pheromone evaporated</text>

  <!-- ===== Bottom legend strip ===== -->
  <line x1="170" y1="400" x2="215" y2="400" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
  <text x="222" y="404" font-family="sans-serif" font-size="12" fill="#92400e" font-weight="bold">Strong pheromone (optimal)</text>
  <line x1="430" y1="400" x2="465" y2="400" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="472" y="404" font-family="sans-serif" font-size="12" fill="#374151">Weak pheromone (evaporated)</text>
</svg>
